classes:
- cookie
- dowel
- foam
- peach
- bagel
- cable_gland
- potato
- carrot
- rope
- tire
paths:
  output_dir: outputs
  stage1_dir: checkpoints/stage1
  stage2_dir: checkpoints/stage2
  visual_encoder_ckpt_pth: [YOUR_OWN_CHECKPOINT_PATH]
  point_encoder_ckpt_pth: [YOUR_OWN_CHECKPOINT_PATH]
  dtd_dataset_path: null
common:
  visual_encoder_size: base
  point_encoder_size: base
  batch_size: 1
  num_epochs: 5
  num_workers: 4
  accumulation_steps: 8
  k_shot: -1
  group_size: 128
  num_group: 1024
  seed: 42
  img_size: 224
  patch_size: 8
  pred_mask_scale:
  - 0.15
  - 0.2
  aspect_ratio:
  - 0.75
  - 1.5
  npred: 4
  min_keep: 6
  bg_ratio_threshold: 0.9
  bg_threshold: 30
  ema_rgb: 0.0
  ema_3d: 0.0
  encoder_size: vit_small
  predictor_depth: 2
  ema_params_rgb:
  - 0.995
  - 1.0
  ema_params_3d:
  - 0.995
  - 1.0
  warmup_epochs: 1
  usage_half_precision: false
  start_lr_rgb: 1.0e-06
  final_lr_rgb: 1.0e-06
  lr_rgb: 1.0e-05
  start_lr_xyz: 1.0e-06
  final_lr_xyz: 1.0e-05
  lr_xyz: 5.0e-05
  weight_decay: 0.01
  final_weight_decay: 0.1
  ipe_scale: 1.0
  vic_rate: 0.01
stages:
  train_1st:
    mode: multimodal
    coreset_percentage_rgb: 0.2
    coreset_percentage_xyz: 0.2
  train_2nd:
    coreset_percentage_rgb: 0.1
    coreset_percentage_xyz: 0.1
    epoch_num: 1
    bank_lr_rgb: 1.0e-05
    bank_lr_xyz: 1.0e-05
  inference:
    coreset_percentage_rgb: 0.1
    coreset_percentage_xyz: 0.1
    mode: combined
class_overrides:
  cookie:
    train_1st:
      num_epochs: 1
      start_lr_xyz: 1.0e-07
      final_lr_xyz: 1.0e-07
      lr_xyz: 1.0e-06
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  dowel:
    train_1st:
      num_epochs: 4
      start_lr_xyz: 1.0e-07
      final_lr_xyz: 1.0e-07
      lr_xyz: 1.0e-06
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  foam:
    train_1st:
      num_epochs: 10
      start_lr_xyz: 1.0e-05
      lr_xyz: 0.0001
  peach:
    train_1st:
      num_epochs: 10
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  bagel:
    train_1st:
      num_epochs: 10
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  cable_gland:
    train_1st:
      num_epochs: 12
      start_lr_xyz: 1.0e-05
      lr_xyz: 0.0001
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  potato:
    train_1st:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  carrot:
    train_1st:
      num_epochs: 10
      min_keep: 4
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  rope:
    train_1st:
      start_lr_xyz: 1.0e-05
      lr_xyz: 0.0001
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
  tire:
    train_1st:
      num_epochs: 10
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
    train_2nd:
      final_lr_xyz: 1.0e-06
      lr_xyz: 1.0e-05
